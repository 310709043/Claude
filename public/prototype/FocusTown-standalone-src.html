<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>FocusTown — 找你的人 · 找你的專注</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&family=DotGothic16&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root {
    /* --- Direction 1: NEON NIGHT (default) --- */
    --bg-0: #07041a;
    --bg-1: #110826;
    --bg-2: #1c0f3d;
    --sky-top: #07041a;
    --sky-mid: #1a0d3d;
    --sky-low: #2a1854;
    --ink: #f5f3ff;
    --ink-mute: #a89bd6;
    --ink-dim: #6b5e9a;
    --accent: #b794f6;        /* primary purple */
    --accent-2: #ec4899;       /* magenta */
    --accent-3: #22d3ee;       /* cyan */
    --accent-4: #fbbf24;       /* warm yellow lights */
    --window-warm: #fcd34d;    /* glowing window */
    --window-cool: #67e8f9;
    --window-pink: #f0abfc;
    --window-mint: #6ee7b7;
    --panel-bg: rgba(11,6,29,0.85);
    --panel-stroke: rgba(167,139,250,0.35);
    --panel-stroke-strong: rgba(167,139,250,0.6);
    --button-fill: rgba(183,148,246,0.12);
    --grid-line: rgba(167,139,250,0.08);
    --scan: rgba(255,255,255,0.02);
    --neon-glow: 0 0 6px rgba(183,148,246,0.6), 0 0 14px rgba(183,148,246,0.35);
    --neon-glow-pink: 0 0 6px rgba(236,72,153,0.7), 0 0 14px rgba(236,72,153,0.4);
    --neon-glow-cyan: 0 0 6px rgba(34,211,238,0.7), 0 0 14px rgba(34,211,238,0.4);
  }

  /* --- Direction 2: DUSK LOFI --- */
  :root[data-direction="dusk"] {
    --bg-0: #2a0d1f;
    --bg-1: #4a1a2e;
    --bg-2: #6e2a3a;
    --sky-top: #2a0d1f;
    --sky-mid: #b94a6e;
    --sky-low: #f0825a;
    --ink: #fff5e1;
    --ink-mute: #f0c7a3;
    --ink-dim: #b8896e;
    --accent: #ffb86b;
    --accent-2: #ff6b9d;
    --accent-3: #ffd166;
    --accent-4: #fbbf24;
    --window-warm: #ffd166;
    --window-cool: #ff8c5a;
    --window-pink: #ff6b9d;
    --window-mint: #ffb86b;
    --panel-bg: rgba(42,13,31,0.88);
    --panel-stroke: rgba(255,184,107,0.35);
    --panel-stroke-strong: rgba(255,184,107,0.6);
    --button-fill: rgba(255,184,107,0.12);
    --grid-line: rgba(255,184,107,0.08);
    --neon-glow: 0 0 6px rgba(255,184,107,0.65), 0 0 14px rgba(255,184,107,0.35);
    --neon-glow-pink: 0 0 6px rgba(255,107,157,0.7), 0 0 14px rgba(255,107,157,0.4);
    --neon-glow-cyan: 0 0 6px rgba(255,209,102,0.7), 0 0 14px rgba(255,209,102,0.4);
  }

  /* --- Direction 3: RAINY SYNTHWAVE --- */
  :root[data-direction="rain"] {
    --bg-0: #03061a;
    --bg-1: #050d2a;
    --bg-2: #0a1845;
    --sky-top: #03061a;
    --sky-mid: #0a1845;
    --sky-low: #1a2a6a;
    --ink: #e0f7ff;
    --ink-mute: #88a8d8;
    --ink-dim: #4a6890;
    --accent: #00f5d4;
    --accent-2: #ff006e;
    --accent-3: #8338ec;
    --accent-4: #ffbe0b;
    --window-warm: #ffbe0b;
    --window-cool: #00f5d4;
    --window-pink: #ff006e;
    --window-mint: #06d6a0;
    --panel-bg: rgba(5,13,42,0.88);
    --panel-stroke: rgba(0,245,212,0.3);
    --panel-stroke-strong: rgba(0,245,212,0.55);
    --button-fill: rgba(0,245,212,0.1);
    --grid-line: rgba(0,245,212,0.06);
    --neon-glow: 0 0 6px rgba(0,245,212,0.65), 0 0 14px rgba(0,245,212,0.35);
    --neon-glow-pink: 0 0 6px rgba(255,0,110,0.75), 0 0 14px rgba(255,0,110,0.4);
    --neon-glow-cyan: 0 0 6px rgba(0,245,212,0.7), 0 0 14px rgba(0,245,212,0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  html, body, #root { background: var(--bg-0); color: var(--ink); }
  #root { height: 100%; }
  body {
    font-family: "Noto Sans TC", "Silkscreen", system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    image-rendering: pixelated;
  }
  img, canvas { image-rendering: pixelated; image-rendering: crisp-edges; }

  /* Pixel font helpers */
  .px-en, .silkscreen { font-family: "Silkscreen", "Press Start 2P", monospace; letter-spacing: 0.04em; }
  .vt { font-family: "VT323", monospace; }
  .ps2p { font-family: "Press Start 2P", monospace; letter-spacing: 0.05em; }

  /* shared retro scanline + grain overlay */
  .crt {
    position: relative;
  }
  .crt::before {
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
    background:
      repeating-linear-gradient(to bottom, rgba(255,255,255,0.015) 0 1px, transparent 1px 4px),
      radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.4) 100%);
    z-index: 9999;
    mix-blend-mode: overlay;
    opacity: 0.5;
  }

  /* Generic pixel panel */
  .pixel-panel {
    background: var(--panel-bg);
    border: 1px solid var(--panel-stroke);
    box-shadow: 0 0 0 2px var(--bg-0), 0 0 0 3px var(--panel-stroke), 0 12px 30px rgba(0,0,0,0.6);
    border-radius: 2px;
  }
  .pixel-input {
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--panel-stroke);
    color: var(--ink);
    padding: 10px 14px;
    font-family: "Silkscreen", "Noto Sans TC", monospace;
    font-size: 13px;
    outline: none;
    width: 100%;
  }
  .pixel-input:focus { border-color: var(--accent); box-shadow: var(--neon-glow); }
  .pixel-input::placeholder { color: var(--ink-dim); }

  .pixel-btn {
    background: var(--button-fill);
    border: 1px solid var(--panel-stroke-strong);
    color: var(--ink);
    padding: 10px 18px;
    font-family: "Silkscreen", "Noto Sans TC", monospace;
    font-size: 13px;
    letter-spacing: 0.06em;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.12s steps(2);
    position: relative;
  }
  .pixel-btn:hover { background: rgba(183,148,246,0.2); box-shadow: var(--neon-glow); transform: translateY(-1px); }
  .pixel-btn.primary { background: var(--accent); color: #0a0524; border-color: var(--accent); font-weight: 700; }
  .pixel-btn.primary:hover { box-shadow: var(--neon-glow); filter: brightness(1.1); }

  /* Hide scrollbars */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-1); }
  ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 0; }

  /* utility: blink */
  @keyframes blink { 50% { opacity: 0; } }
  .blink { animation: blink 1s steps(2) infinite; }

  @keyframes shimmer { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
  .shimmer { animation: shimmer 2.5s ease-in-out infinite; }

  @keyframes drift {
    from { transform: translateX(0); }
    to { transform: translateX(-100%); }
  }

  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }
  .float { animation: float 2s steps(4) infinite; }

  @keyframes glow-pulse {
    0%,100% { filter: brightness(1); }
    50% { filter: brightness(1.3); }
  }

  /* Splash screen */
  #splash {
    position: fixed; inset: 0;
    background: var(--bg-0);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 99999;
    transition: opacity 0.4s;
  }
  #splash.hide { opacity: 0; pointer-events: none; }
  .splash-logo {
    font-family: "Press Start 2P", monospace;
    font-size: 32px;
    color: var(--accent);
    text-shadow: var(--neon-glow);
    letter-spacing: 0.08em;
  }
  .splash-tag { font-family: "Silkscreen", monospace; color: var(--ink-mute); margin-top: 12px; letter-spacing: 0.2em; }
  .splash-load {
    margin-top: 30px; width: 180px; height: 8px;
    border: 1px solid var(--panel-stroke);
    overflow: hidden;
  }
  .splash-load::after {
    content: "";
    display: block; height: 100%; width: 0;
    background: var(--accent);
    animation: load 0.8s steps(20) forwards;
    box-shadow: var(--neon-glow);
  }
  @keyframes load { to { width: 100%; } }
</style>
</head>
